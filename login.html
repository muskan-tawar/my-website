<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jewelry Store - Login</title>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Login CSS -->
    <link rel="stylesheet" href="loginstyle.css">
</head>
<body>
    <div class="container py-5">
        <button type="button" class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#loginModal">
            <i class="bi bi-person me-2"></i>
            Login
        </button>
    </div>
    <!-- Login Modal -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content login-modal-content">
                <!-- Close Button -->
                <div class="modal-header border-0">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <!-- Login Body -->
                <div class="modal-body px-4 px-md-5 pb-5 pt-0">
                    <!-- Username -->
                    <div class="mb-4">
                        <label for="username" class="form-label login-label">
                            Username or Email Address
                        </label>
                        <input type="text" class="form-control login-input" id="username" autocomplete="username">
                        <div class="invalid-feedback" id="usernameError">
                            Please enter your username or email.
                        </div>
                    </div>
                    <!-- Password -->
                    <div class="mb-4">
                        <label for="password" class="form-label login-label">
                            Password
                        </label>
                        <input type="password" class="form-control login-input" id="password" autocomplete="current-password">
                        <div class="invalid-feedback" id="passwordError">
                            Please enter your password.
                        </div>
                    </div>
                    <!-- Remember Me -->
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" value="" id="rememberMe" checked>
                        <label class="form-check-label remember-label" for="rememberMe">
                            Remember Me
                        </label>
                    </div>
                    <!-- Login Button -->
                    <button type="button" class="btn login-button" id="loginButton">
                        LOG IN
                    </button>
                    <!-- Lost Password -->
                    <div class="mt-4">
                        <a href="#" class="lost-password" id="forgotPassword">
                            Lost your password?
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="loginjs.js"></script>
</body>
</html>

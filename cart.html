<!-- =========================================================
     SHOPPING CART COMPONENT
     cartjs.js is file ko automatically load karega.
========================================================= -->


<!-- =========================================================
     DARK OVERLAY
========================================================= -->

<div
    id="cartOverlay"
    class="cart-overlay"
    onclick="closeCart()"
></div>


<!-- =========================================================
     SHOPPING CART OFFCANVAS
========================================================= -->

<div
    id="shoppingCart"
    class="offcanvas offcanvas-end shopping-cart-offcanvas"
    tabindex="-1"
    aria-labelledby="shoppingCartLabel"
>


    <!-- =====================================================
         CART HEADER
    ====================================================== -->

    <div class="offcanvas-header border-bottom px-4 py-3">

        <h5
            class="offcanvas-title fw-normal"
            id="shoppingCartLabel"
        >
            Shopping Cart
        </h5>


        <button
            type="button"
            class="btn-close"
            onclick="closeCart()"
            aria-label="Close"
        ></button>

    </div>



    <!-- =====================================================
         CART BODY
    ====================================================== -->

    <div class="offcanvas-body p-0 d-flex flex-column">


        <!-- =================================================
             PRODUCT
        ================================================== -->

        <div
            id="cartProduct"
            class="cart-product p-4 d-flex gap-3"
        >


            <!-- =================================================
                 PRODUCT IMAGE
            ================================================== -->

            <div class="flex-shrink-0">

                <img
                    id="offcanvasProductImage"
                    src=""
                    class="cart-product-image"
                    alt="Jewellery Product"
                >

            </div>



            <!-- =================================================
                 PRODUCT INFORMATION
            ================================================== -->

            <div class="flex-grow-1">


                <!-- PRODUCT NAME + REMOVE -->

                <div class="d-flex justify-content-between align-items-start">

                    <h6
                        id="offcanvasProductName"
                        class="mb-2 fw-normal"
                    >
                        Jewellery Product
                    </h6>


                    <button
                        type="button"
                        class="btn btn-sm text-secondary p-0"
                        onclick="removeProduct()"
                        aria-label="Remove product"
                    >

                        <i class="bi bi-x-circle fs-5"></i>

                    </button>

                </div>



                <!-- =================================================
                     QUANTITY + PRICE
                ================================================== -->

                <div class="d-flex justify-content-between align-items-end">


                    <!-- QUANTITY -->

                    <div class="btn-group border">


                        <button
                            type="button"
                            class="btn btn-light border-0 rounded-0"
                            onclick="decreaseQuantity()"
                        >
                            −
                        </button>


                        <span
                            id="offcanvasQuantity"
                            class="cart-quantity-number d-inline-flex align-items-center justify-content-center"
                        >
                            0
                        </span>


                        <button
                            type="button"
                            class="btn btn-light border-0 rounded-0"
                            onclick="increaseQuantity()"
                        >
                            +
                        </button>

                    </div>



                    <!-- PRICE -->

                    <span
                        id="productPrice"
                        class="text-secondary"
                    >
                        $0.00
                    </span>

                </div>

            </div>

        </div>



        <!-- =================================================
             EMPTY CART
        ================================================== -->

        <div
            id="emptyCart"
            class="d-none text-center py-5 px-4"
        >

            <i class="bi bi-bag fs-1 text-secondary"></i>


            <h5 class="mt-3">
                Your cart is empty
            </h5>


            <p class="text-secondary mb-0">
                Add some beautiful jewellery to your cart.
            </p>

        </div>



        <!-- =================================================
             CART BOTTOM
        ================================================== -->

        <div class="mt-auto border-top">


            <!-- =================================================
                 SUBTOTAL
            ================================================== -->

            <div class="d-flex justify-content-between px-4 py-3">

                <span class="fs-6">
                    Subtotal:
                </span>


                <span
                    id="subtotal"
                    class="text-secondary"
                >
                    $0.00
                </span>

            </div>



            <!-- =================================================
                 VIEW CART
            ================================================== -->

            <div class="px-4 pb-3">

                <button
                    type="button"
                    class="btn btn-outline-dark w-100 py-3 rounded-0"
                    onclick="goToCartView()"
                >
                    VIEW CART
                </button>

            </div>



            <!-- =================================================
                 CHECKOUT
            ================================================== -->

            <div class="px-4 pb-4">

                <button
                    type="button"
                    id="cartCheckoutBtn"
                    class="btn btn-dark w-100 py-3 rounded-0"
                    onclick="goToCheckout()"
                >
                    CHECKOUT
                </button>

            </div>


        </div>


    </div>

</div>

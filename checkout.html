<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jewellery Store - Checkout</title>


    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Montserrat:wght@400;500;600&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         BOOTSTRAP CSS
    ====================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =====================================================
         BOOTSTRAP ICONS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- =====================================================
         CHECKOUT CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="checkoutstyle.css"
    >


    <!-- =====================================================
         GLOBAL CART CSS
         Sirf isliye add kiya gaya hai taaki agar checkout
         page par global cart use ho to styling available rahe.
    ====================================================== -->

    <link
        rel="stylesheet"
        href="cartstyle.css"
    >

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="checkout-header">

        <div class="container-fluid">

            <a
                href="home.html"
                class="checkout-logo"
            >

                <img
                    src="imgs/logo-regular.png"
                    alt="Jewellery Store"
                >

            </a>

        </div>

    </header>



    <!-- =====================================================
         MAIN CHECKOUT
    ====================================================== -->

    <main class="checkout-page">

        <div class="checkout-wrapper">


            <!-- =================================================
                 LEFT SIDE
            ================================================== -->

            <section class="checkout-left">


                <!-- =================================================
                     CONTACT
                ================================================== -->

                <div class="checkout-section">

                    <h2 class="section-title">
                        Contact
                    </h2>

                    <div class="form-group">

                        <input
                            type="email"
                            id="email"
                            class="form-control checkout-input"
                            placeholder="Email Address *"
                            required
                        >

                    </div>

                </div>



                <!-- =================================================
                     BILLING DETAILS
                ================================================== -->

                <div class="checkout-section">

                    <h2 class="section-title">
                        Billing Details
                    </h2>


                    <!-- First + Last Name -->

                    <div class="row g-2">

                        <div class="col-md-6">

                            <input
                                type="text"
                                id="firstName"
                                class="form-control checkout-input"
                                placeholder="First name *"
                                required
                            >

                        </div>


                        <div class="col-md-6">

                            <input
                                type="text"
                                id="lastName"
                                class="form-control checkout-input"
                                placeholder="Last name *"
                                required
                            >

                        </div>

                    </div>



                    <!-- Country -->

                    <div class="form-floating mt-2">

                        <select
                            id="country"
                            class="form-select checkout-input"
                        >

                            <option value="United States">
                                United States (US)
                            </option>

                            <option value="India">
                                India
                            </option>

                            <option value="United Kingdom">
                                United Kingdom
                            </option>

                            <option value="Canada">
                                Canada
                            </option>

                        </select>

                        <label for="country">
                            Country / Region
                        </label>

                    </div>



                    <!-- Address -->

                    <input
                        type="text"
                        id="address"
                        class="form-control checkout-input mt-2"
                        placeholder="House number and street name *"
                        required
                    >


                    <!-- Apartment -->

                    <input
                        type="text"
                        id="apartment"
                        class="form-control checkout-input mt-2"
                        placeholder="Apartment, suite, unit, etc. (optional)"
                    >



                    <!-- City / State / Postcode -->

                    <div class="row g-2 mt-1">

                        <div class="col-md-4">

                            <input
                                type="text"
                                id="city"
                                class="form-control checkout-input"
                                placeholder="Town / City *"
                                required
                            >

                        </div>


                        <div class="col-md-4">

                            <select
                                id="state"
                                class="form-select checkout-input"
                            >

                                <option value="">
                                    State
                                </option>

                                <option value="California">
                                    California
                                </option>

                                <option value="Madhya Pradesh">
                                    Madhya Pradesh
                                </option>

                                <option value="Maharashtra">
                                    Maharashtra
                                </option>

                                <option value="Delhi">
                                    Delhi
                                </option>

                                <option value="Rajasthan">
                                    Rajasthan
                                </option>

                            </select>

                        </div>


                        <div class="col-md-4">

                            <input
                                type="text"
                                id="postcode"
                                class="form-control checkout-input"
                                placeholder="Postcode / ZIP *"
                                required
                            >

                        </div>

                    </div>



                    <!-- Phone -->

                    <input
                        type="tel"
                        id="phone"
                        class="form-control checkout-input mt-2"
                        placeholder="Phone *"
                        required
                    >

                </div>



                <!-- =================================================
                     ADDITIONAL INFORMATION
                ================================================== -->

                <div class="checkout-section">

                    <h2 class="section-title">
                        Additional Information
                    </h2>

                    <textarea
                        id="orderNotes"
                        class="form-control checkout-textarea"
                        placeholder="Notes about your order, e.g. special notes for delivery."
                    ></textarea>

                </div>



                <!-- =================================================
                     PAYMENT
                ================================================== -->

                <div class="checkout-section payment-section">

                    <h2 class="section-title">
                        Payment
                    </h2>


                    <div class="payment-message">

                        <div class="payment-checkbox">

                            <input
                                type="checkbox"
                                id="paymentAgree"
                            >

                        </div>


                        <label for="paymentAgree">

                            Sorry, it seems that there are no available
                            payment methods for your state.

                            <br>

                            Please contact us if you require assistance
                            or wish to make alternate arrangements.

                        </label>

                    </div>

                </div>



                <!-- =================================================
                     PLACE ORDER
                ================================================== -->

                <button
                    type="button"
                    id="placeOrderBtn"
                    class="place-order-btn"
                >

                    <i class="bi bi-lock-fill"></i>

                    <span>
                        Place Order
                    </span>

                    <strong id="placeOrderTotal">
                        $0.00
                    </strong>

                </button>


            </section>



            <!-- =================================================
                 RIGHT SIDE - ORDER SUMMARY
            ================================================== -->

            <aside class="checkout-right">


                <!-- =================================================
                     PRODUCT LIST
                ================================================== -->

                <div
                    id="checkoutProducts"
                    class="checkout-products"
                >
                    <!-- Products will be inserted by checkoutjs.js -->
                </div>



                <!-- =================================================
                     COUPON
                ================================================== -->

                <div class="coupon-area">

                    <input
                        type="text"
                        id="couponCode"
                        class="coupon-input"
                        placeholder="Coupon Code"
                    >

                    <button
                        type="button"
                        id="applyCoupon"
                        class="coupon-btn"
                    >
                        Apply
                    </button>

                </div>


                <p
                    id="couponMessage"
                    class="coupon-message"
                ></p>



                <!-- =================================================
                     TOTALS
                ================================================== -->

                <div class="checkout-totals">

                    <div class="total-row">

                        <span>
                            Subtotal
                        </span>

                        <span id="checkoutSubtotal">
                            $0.00
                        </span>

                    </div>


                    <div class="total-row total-final">

                        <span>
                            Total
                        </span>

                        <span id="checkoutTotal">
                            $0.00
                        </span>

                    </div>

                </div>


            </aside>

        </div>

    </main>



    <!-- =====================================================
         BOOTSTRAP JS
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- =====================================================
         GLOBAL CART JS
    ====================================================== -->

    <script src="cartjs.js"></script>


    <!-- =====================================================
         CHECKOUT JS
    ====================================================== -->

    <script src="checkoutjs.js"></script>


</body>

</html>
